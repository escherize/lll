# Toolchain for lll. `mise install` provisions everything the build and the e2e
# scripts shell out to.
#
# python3 is NOT here either: mise's build fails on this machine and the
# system python3 is what the scripts use.
#
# `lis` is NOT here: Lisette ships as a GitHub release, not a mise plugin.
# Install it with the upstream installer and keep it on PATH:
#   curl -LsSf https://github.com/ivov/lisette/releases/latest/download/lisette-installer.sh | sh
# lll is built and verified against lis 0.12.0.

[tools]
go = "1.27"   # PocketBase v0.40.1 and gopb both declare go 1.27
jq = "1.8"

# The binary lis builds, on PATH. With mise activated, `lll` in any shell under
# the checkout is the freshly built one — no install step, nothing to go stale.
[env]
_.path = ["{{config_root}}/target/.lisette/bin"]

# Tasks. `mise tasks` lists them. Each pins dir to the checkout root, because
# lll up reads pb/ and web/ relative to the working directory.
#
# Note: not named `up` — `mise run up` collides with mise's own `mise up`.

[tasks.build]
description = "Compile lll to target/.lisette/bin/lll"
dir = "{{config_root}}"
run = """
command -v lis >/dev/null || { echo "lis not found. Install it:" >&2; echo "  curl -LsSf https://github.com/ivov/lisette/releases/latest/download/lisette-installer.sh | sh" >&2; exit 1; }
bash scripts/lis-typedefs-workaround.sh
lis build
"""

[tasks.dev]
description = "Build, then run PocketBase + the web board"
depends = ["build"]
dir = "{{config_root}}"
run = "target/.lisette/bin/lll up"

[tasks.test]
description = "Unit tests"
dir = "{{config_root}}"
run = """
command -v lis >/dev/null || { echo "lis not found. Install it:" >&2; echo "  curl -LsSf https://github.com/ivov/lisette/releases/latest/download/lisette-installer.sh | sh" >&2; exit 1; }
bash scripts/lis-typedefs-workaround.sh
lis test
"""

[tasks.e2e]
description = "Full end-to-end suite (CLI, web board, lll up)"
depends = ["build"]
dir = "{{config_root}}"
run = "bash scripts/e2e.sh"

[tasks.gate]
description = "Everything a change must pass before it lands"
depends = ["build", "test", "e2e"]
dir = "{{config_root}}"
run = "echo 'gate green'"
