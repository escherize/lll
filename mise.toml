# Toolchain for lll. `mise install` provisions everything the build and the e2e
# scripts shell out to.
#
# python3 is NOT here either: mise's build fails on this machine and the
# system python3 is what the scripts use.
#
# `lis` is NOT here: Lisette ships as a GitHub release, not a mise plugin.
# Install it with the upstream installer and keep it on PATH:
#   curl -LsSf https://github.com/ivov/lisette/releases/latest/download/lisette-installer.sh | sh
# lll is built and verified against lis 0.12.0.

[tools]
go = "1.27"   # PocketBase v0.40.1 and gopb both declare go 1.27
jq = "1.8"

# The binary lis builds, on PATH. With mise activated, `lll` in any shell under
# the checkout is the freshly built one — no install step, nothing to go stale.
[env]
_.path = ["{{config_root}}/target/.lisette/bin"]

# Tasks. `mise tasks` lists them. Each pins dir to the checkout root so builds
# and repository scripts resolve their inputs consistently. The server embeds
# its migrations, templates and static assets and can run outside the checkout.
#
# Note: not named `up` — `mise run up` collides with mise's own `mise up`.

[tasks.build]
description = "Compile lll to target/.lisette/bin/lll"
# C is available on macOS and Linux; Python keeps explicit UTF-8 text I/O.
# Task-local settings leave the developer's interactive locale unchanged.
env = { LC_ALL = "C", PYTHONUTF8 = "1" }
dir = "{{config_root}}"
run = """
command -v lis >/dev/null || { echo "lis not found. Install it:" >&2; echo "  curl -LsSf https://github.com/ivov/lisette/releases/latest/download/lisette-installer.sh | sh" >&2; exit 1; }
lis build
"""

[tasks.dev]
description = "Build, then run PocketBase + the web board"
depends = ["build"]
dir = "{{config_root}}"
run = "target/.lisette/bin/lll up"

[tasks.scratch]
description = "A throwaway board on free ports and a temp data dir - safe to run alongside others"
depends = ["build"]
dir = "{{config_root}}"
env = { LC_ALL = "C", PYTHONUTF8 = "1" }
run = "bash scripts/scratch.sh"

[tasks.archive-protect]
description = "Make retained .private history read-only without changing its contents"
dir = "{{config_root}}"
run = "python3 scripts/protect_archive.py"

[tasks.test]
description = "Unit tests"
env = { LC_ALL = "C", PYTHONUTF8 = "1" }
dir = "{{config_root}}"
run = """
command -v lis >/dev/null || { echo "lis not found. Install it:" >&2; echo "  curl -LsSf https://github.com/ivov/lisette/releases/latest/download/lisette-installer.sh | sh" >&2; exit 1; }
python3 scripts/protect_archive.py --check
lis test
go -C web test ./...
go -C gopb test ./...
python3 -m unittest discover -s scripts -p 'test_browser_poll.py'
python3 -m unittest discover -s scripts -p 'test_browser_session.py'
python3 -m unittest discover -s scripts -p 'test_check_assets.py'
python3 -m unittest discover -s scripts -p 'test_sidecar_dependencies.py'
python3 -m unittest discover -s scripts -p 'test_import_sidecar.py'
python3 -m unittest discover -s scripts -p 'test_reap.py'
python3 -m unittest discover -s scripts -p 'test_export.py'
python3 -m unittest discover -s scripts -p 'test_protect_archive.py'
python3 scripts/check_assets.py
"""

[tasks.e2e]
description = "Full end-to-end suite (CLI, web board, lll up)"
env = { LC_ALL = "C", PYTHONUTF8 = "1" }
depends = ["build"]
dir = "{{config_root}}"
run = "bash scripts/e2e.sh"

# TASK-79: a board with data on it, for looking at. Boots its own throwaway
# server on free ports under .lll-demo/ and leaves it running, so `mise run dev`
# (port 8100, pb/pb_data) is untouched and two people can seed at once.
#
# depends on build rather than building inside the script: seed.sh moves HOME
# aside to keep the developer's own config out of the fixtures, and the lis and
# go caches live under the real HOME.
[tasks.seed]
description = "Boot a throwaway board seeded with demo issues, projects and labels"
depends = ["build"]
dir = "{{config_root}}"
run = "bash scripts/seed.sh"

[tasks.gate]
description = "Everything a change must pass before it lands"
env = { LC_ALL = "C", PYTHONUTF8 = "1" }
depends = ["build", "test", "e2e"]
dir = "{{config_root}}"
run = "echo 'gate green'"
