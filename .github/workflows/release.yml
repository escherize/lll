# Release binaries on tag push (v*). Runs on macos-14 for the same reason as
# gate.yml: lis cannot bindgen on linux. darwin-arm64 is a native `lis build`;
# the linux binaries are `GOOS=linux go build` over a darwin `lis emit`
# (scripts/emit-relative.sh) — the same pipeline scripts/fly-deploy.sh proves
# on every deploy. Pure-Go deps (modernc sqlite), so CGO_ENABLED=0 cross
# builds are static and portable.
#
# Cutting a release:
#   1. bump [project] version in lisette.toml (checked against the tag below)
#      and the fallback in src/commands/version.lis (what an installed binary
#      reports outside a checkout)
#   2. git tag v<version> && git push origin v<version>
#
# On the same tags the workflow also renders packaging/homebrew/lll.rb.template
# into a Homebrew formula (version + binary sha256s) and pushes it to a tap
# repo (default escherize/homebrew-lll). That step is skipped cleanly when the
# TAP_TOKEN secret is absent, so releases stay green before the tap exists.

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: release
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          # `lll --version` now derives from `git describe --tags`, which
          # needs the tag history present. A shallow checkout can report a
          # bare SHA and fail the version check below.
          fetch-depth: 0

      # Fail fast, before any toolchain install: the tag must equal the
      # version lisette.toml declares.
      - name: Tag matches lisette.toml version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(sed -n 's/^version = "\(.*\)"$/\1/p' lisette.toml | head -1)"
          if [ "$tag" != "$ver" ]; then
            echo "tag v$tag disagrees with lisette.toml version $ver — bump lisette.toml (and src/commands/version.lis) or retag" >&2
            exit 1
          fi

      # Toolchain setup: identical to gate.yml (see comments there).
      - uses: jdx/mise-action@v2
        with:
          install: false

      - name: Trust repo config
        run: mise trust

      - name: Install tools
        run: mise install

      - name: Install lis 0.12.0
        run: |
          curl -LsSf https://github.com/ivov/lisette/releases/download/lisette-v0.12.0/lisette-installer.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build darwin-arm64 (native lis)
        run: |
          mise exec -- lis build
          mkdir -p dist
          cp target/.lisette/bin/lll dist/lll-darwin-arm64

      # `lll --version` derives from `git describe --tags`, so at this tag
      # checkout the built binary must answer the tag itself — check it.
      - name: lll --version matches the tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          out="$(dist/lll-darwin-arm64 --version)"
          if [ "$out" != "lll $tag" ]; then
            echo "built binary says '$out', tag wants 'lll $tag' — bump src/commands/version.lis" >&2
            exit 1
          fi

      - name: Emit Go for the linux builds
        run: mise exec -- bash scripts/emit-relative.sh

      - name: Build linux amd64 + arm64
        run: |
          cd target
          for arch in amd64 arm64; do
            GOOS=linux GOARCH="$arch" CGO_ENABLED=0 mise exec -- go build -o "../dist/lll-linux-$arch" .
          done

      - name: Attach binaries to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/lll-* --title "$GITHUB_REF_NAME" --generate-notes ||
            gh release upload "$GITHUB_REF_NAME" dist/lll-* --clobber

      - name: Render the Homebrew formula
        run: |
          tag="${GITHUB_REF_NAME#v}"
          sed -e "s/__VERSION__/$tag/" \
              -e "s/__SHA256_DARWIN_ARM64__/$(shasum -a 256 dist/lll-darwin-arm64 | cut -d' ' -f1)/" \
              -e "s/__SHA256_LINUX_AMD64__/$(shasum -a 256 dist/lll-linux-amd64 | cut -d' ' -f1)/" \
              -e "s/__SHA256_LINUX_ARM64__/$(shasum -a 256 dist/lll-linux-arm64 | cut -d' ' -f1)/" \
            packaging/homebrew/lll.rb.template > dist/lll.rb

      - name: Push the formula to the Homebrew tap
        env:
          # No TAP_TOKEN secret (or no tap repo) yet? Skip cleanly: releases
          # must stay green before the human creates escherize/homebrew-lll.
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
          TAP_REPO: ${{ vars.TAP_REPO }}
          GH_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "TAP_TOKEN secret is not set - skipping Homebrew tap update."
            echo "To enable: create the tap repo (default escherize/homebrew-lll),"
            echo "add a TAP_TOKEN secret (repo-scoped contents:write), and optionally a"
            echo "TAP_REPO variable to override the default. Formula rendered at dist/lll.rb."
            exit 0
          fi
          repo="${TAP_REPO:-escherize/homebrew-lll}"
          rm -rf tap && gh repo clone "$repo" tap
          mkdir -p tap/Formula
          cp dist/lll.rb tap/Formula/lll.rb
          git -C tap add Formula/lll.rb
          if git -C tap diff --cached --quiet; then
            echo "tap formula already up to date"
          else
            # gh repo clone authenticates the clone, not a later push;
            # point the remote at the token explicitly.
            git -C tap remote set-url origin "https://x-access-token:${TAP_TOKEN}@github.com/${repo}.git"
            git -C tap -c user.name=lll-release -c user.email=actions@github.com \
              commit -m "lll ${GITHUB_REF_NAME}"
            git -C tap push
          fi
