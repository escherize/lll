# The gate compiles and tests on ubuntu-24.04 (LLL-814). It ran on macOS until
# lis 0.12.1 fixed a bindgen panic on Linux (ivov/lisette#1360); hosted macOS
# runners are capped at five concurrent jobs and starved runs. One macOS job
# remains, because the released CLI is a darwin/arm64 binary.

name: gate

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: gate-${{ github.ref }}
  # Never interrupt a production deployment midway through its rollout.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # LLL-805: the gate's parts run on separate runners so the wall time is the
  # slowest part, not their sum. Together the matrix runs what `mise run gate`
  # runs; scripts/test_ci_parts.py fails when a part is missing here.
  checks:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: unit tests
            run: "mise run build ::: test"
          - name: e2e core
            run: mise run e2e-core
          - name: e2e standalone and lll up
            run: E2E_SHARD=1/1 mise run e2e-standalone && mise run e2e-up
          - name: e2e web
            run: mise run e2e-web
    steps:
      - uses: actions/checkout@v4

      # Install the mise binary only. The repo's mise.toml is untrusted in a
      # fresh checkout (hit locally in TASK-150), so the action must not read
      # it (install off) — the next step trusts it first.
      - uses: jdx/mise-action@v2
        with:
          install: false

      - name: Trust repo config
        run: mise trust

      # Provisions go 1.27 and jq from mise.toml.
      - name: Install tools
        run: mise install

      # lis ships as a GitHub release, not a mise plugin (see mise.toml).
      # Pinned to 0.12.5, the version mise.toml says lll is verified against.
      - name: Install lis 0.12.5
        run: |
          curl -LsSf https://github.com/ivov/lisette/releases/download/lisette-v0.12.5/lisette-installer.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - uses: ./.github/actions/setup-browser

      - name: ${{ matrix.name }}
        run: |
          command -v playwright-cli
          ${{ matrix.run }}

  # The released binary is darwin/arm64 (release.yml), so one job compiles and
  # runs the unit tests there. The end-to-end suites run on Linux only.
  macos:
    name: macOS build and unit tests
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          install: false
      - name: Trust repo config
        run: mise trust
      - name: Install tools
        run: mise install
      - name: Install lis 0.12.5
        run: |
          curl -LsSf https://github.com/ivov/lisette/releases/download/lisette-v0.12.5/lisette-installer.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build and unit tests
        run: "mise run build ::: test"

  # The source context the Docker build and the deploy both use: the checked-out
  # HEAD with Go already emitted, so neither needs a Lisette installation.
  context:
    name: deployment context
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          install: false
      - name: Trust repo config
        run: mise trust
      - name: Install tools
        run: mise install
      - name: Install lis 0.12.5
        run: |
          curl -LsSf https://github.com/ivov/lisette/releases/download/lisette-v0.12.5/lisette-installer.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Prepare portable deployment context
        run: |
          mkdir "$RUNNER_TEMP/deploy-context"
          mise exec -- bash scripts/prepare-deploy-context.sh "$RUNNER_TEMP/deploy-context"
          tar -czf "$RUNNER_TEMP/deploy-context.tar.gz" -C "$RUNNER_TEMP/deploy-context" .

      - uses: actions/upload-artifact@v4
        with:
          name: deploy-context
          path: ${{ runner.temp }}/deploy-context.tar.gz
          retention-days: 7
          if-no-files-found: error

  # One check named "gate" that is green only when every part is.
  gate:
    name: gate
    needs: [checks, macos, context]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every part passed
        run: |
          [ "${{ needs.checks.result }}" = success ] && [ "${{ needs.macos.result }}" = success ] && [ "${{ needs.context.result }}" = success ]

  linux:
    name: Linux container and browser gate
    needs: context
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: deploy-context
          path: ${{ runner.temp }}
      - name: Unpack the verified source context
        run: tar -xzf "$RUNNER_TEMP/deploy-context.tar.gz" -C "$GITHUB_WORKSPACE"
      - name: Install board test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
      - uses: ./.github/actions/setup-browser
      - name: Build the production Dockerfile on Linux
        run: |
          docker build -t lll-ci .
          container=$(docker create lll-ci)
          trap 'docker rm "$container" >/dev/null' EXIT
          docker cp "$container:/app/target/.lisette/bin/lll" "$RUNNER_TEMP/lll-linux"
          "$RUNNER_TEMP/lll-linux" --version
      - name: Verify team permissions in the Linux artifact
        run: python3 scripts/test_team_roles.py "$RUNNER_TEMP/lll-linux" --browser
      - name: Verify concurrent issue reads in the Linux artifact
        run: python3 scripts/test_issue_view_reads.py "$RUNNER_TEMP/lll-linux"
      # Linux echoes typed input on its own schedule (LLL-686: a prompt shown
      # before echo was off leaked the token there every time).
      - name: Secret prompts do not echo on a Linux terminal
        run: python3 scripts/test_password_tty.py "$RUNNER_TEMP/lll-linux"
      - name: Exercise the Linux artifact through the board and realtime browser suite
        run: bash scripts/e2e_web.sh --prebuilt "$RUNNER_TEMP/lll-linux" --require-browser

  deploy:
    name: Deploy verified main to Fly
    needs: [gate, linux]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: deploy-context
          path: ${{ runner.temp }}
      - name: Unpack the verified source context
        run: tar -xzf "$RUNNER_TEMP/deploy-context.tar.gz" -C "$GITHUB_WORKSPACE"
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo 'Configure the repository FLY_API_TOKEN secret with an app-scoped Fly deploy token; see docs/ci-deployment.md.' >&2
            exit 1
          fi
          flyctl deploy --remote-only --config fly.toml .
