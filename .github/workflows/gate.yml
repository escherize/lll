# The gate runs on macos-14 (darwin/arm64), NOT ubuntu — do not "fix" this back
# to linux without first fixing lisette upstream: lis bindgen panics on linux
# while generating Go typedefs for github.com/escherize/lll/gopb — "panic:
# unexpected expr: *ast.KeyValueExpr" in golang.org/x/tools/go/ssa — so
# `lis test` cannot run on ubuntu at all. Confirmed on 0.11.3 AND 0.12.0
# (finding filed 2026-08-31). The identical toolchain (go 1.27.0, cold module
# + build caches) passes on darwin/arm64. Repro: escherize/lll Actions run
# 33320568185. Upstream issue: https://github.com/ivov/lisette/issues/1360

name: gate

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: gate-${{ github.ref }}
  # Never interrupt a production deployment midway through its rollout.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  gate:
    name: gate
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Install the mise binary only. The repo's mise.toml is untrusted in a
      # fresh checkout (hit locally in TASK-150), so the action must not read
      # it (install off) — the next step trusts it first.
      - uses: jdx/mise-action@v2
        with:
          install: false

      - name: Trust repo config
        run: mise trust

      # Provisions go 1.27 and jq from mise.toml.
      - name: Install tools
        run: mise install

      # lis ships as a GitHub release, not a mise plugin (see mise.toml).
      # Pinned to 0.12.0, the version mise.toml says lll is verified against.
      - name: Install lis 0.12.0
        run: |
          curl -LsSf https://github.com/ivov/lisette/releases/download/lisette-v0.12.0/lisette-installer.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - uses: ./.github/actions/setup-browser

      - name: gate
        run: |
          command -v playwright-cli
          mise run gate

      - name: Prepare portable deployment context
        run: |
          mkdir "$RUNNER_TEMP/deploy-context"
          mise exec -- bash scripts/prepare-deploy-context.sh "$RUNNER_TEMP/deploy-context"
          tar -czf "$RUNNER_TEMP/deploy-context.tar.gz" -C "$RUNNER_TEMP/deploy-context" .

      - uses: actions/upload-artifact@v4
        with:
          name: deploy-context
          path: ${{ runner.temp }}/deploy-context.tar.gz
          retention-days: 7
          if-no-files-found: error

  linux:
    name: Linux container and browser gate
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: deploy-context
          path: ${{ runner.temp }}
      - name: Unpack the verified source context
        run: tar -xzf "$RUNNER_TEMP/deploy-context.tar.gz" -C "$GITHUB_WORKSPACE"
      - name: Install board test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
      - uses: ./.github/actions/setup-browser
      - name: Build the production Dockerfile on Linux
        run: |
          docker build -t lll-ci .
          container=$(docker create lll-ci)
          trap 'docker rm "$container" >/dev/null' EXIT
          docker cp "$container:/app/target/.lisette/bin/lll" "$RUNNER_TEMP/lll-linux"
          "$RUNNER_TEMP/lll-linux" --version
      - name: Exercise the Linux artifact through the board and realtime browser suite
        run: bash scripts/e2e_web.sh --prebuilt "$RUNNER_TEMP/lll-linux" --require-browser

  deploy:
    name: Deploy verified main to Fly
    needs: [gate, linux]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: deploy-context
          path: ${{ runner.temp }}
      - name: Unpack the verified source context
        run: tar -xzf "$RUNNER_TEMP/deploy-context.tar.gz" -C "$GITHUB_WORKSPACE"
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo 'Configure the repository FLY_API_TOKEN secret with an app-scoped Fly deploy token; see docs/ci-deployment.md.' >&2
            exit 1
          fi
          flyctl deploy --remote-only --config fly.toml .
