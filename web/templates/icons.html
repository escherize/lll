{{define "icons"}}<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<defs>
<g id="st-backlog"><circle cx="7" cy="7" r="5.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-dasharray="2.2 2.4" stroke-linecap="round"/></g>
<g id="st-todo"><circle cx="7" cy="7" r="5.5" fill="none" stroke="currentColor" stroke-width="1.6"/></g>
<g id="st-in-progress"><circle cx="7" cy="7" r="5.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M7 3.8 A3.2 3.2 0 0 1 10.2 7 L7 7 Z" fill="currentColor"/></g>
<g id="st-in-review"><circle cx="7" cy="7" r="5.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M7 3.8 A3.2 3.2 0 1 1 3.8 7 L7 7 Z" fill="currentColor"/></g>
<g id="st-done"><circle cx="7" cy="7" r="6.2" fill="currentColor"/><path d="M4.6 7.2 L6.3 8.9 L9.6 5.4" fill="none" stroke="#0e0f11" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></g>
<g id="st-cancelled"><circle cx="7" cy="7" r="6.2" fill="currentColor"/><path d="M4.9 4.9 L9.1 9.1 M9.1 4.9 L4.9 9.1" stroke="#0e0f11" stroke-width="1.5" stroke-linecap="round"/></g>
<g id="pri-urgent"><rect x="1.5" y="1.5" width="11" height="11" rx="2.5" fill="var(--accent)"/><path d="M7 4.2 V7.8 M7 9.6 V9.8" stroke="#0e0f11" stroke-width="1.6" stroke-linecap="round"/></g>
<g id="pri-high"><rect x="2" y="8" width="2.6" height="4" rx="1" fill="currentColor"/><rect x="5.7" y="5.5" width="2.6" height="6.5" rx="1" fill="currentColor"/><rect x="9.4" y="3" width="2.6" height="9" rx="1" fill="currentColor"/></g>
<g id="pri-medium"><rect x="2" y="8" width="2.6" height="4" rx="1" fill="currentColor"/><rect x="5.7" y="5.5" width="2.6" height="6.5" rx="1" fill="currentColor"/><rect x="9.4" y="3" width="2.6" height="9" rx="1" fill="currentColor" opacity="0.25"/></g>
<g id="pri-low"><rect x="2" y="8" width="2.6" height="4" rx="1" fill="currentColor"/><rect x="5.7" y="5.5" width="2.6" height="6.5" rx="1" fill="currentColor" opacity="0.25"/><rect x="9.4" y="3" width="2.6" height="9" rx="1" fill="currentColor" opacity="0.25"/></g>
<g id="pri-none"><path d="M2.5 7 h2 M6 7 h2 M9.5 7 h2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/></g>
<g id="ic-board"><rect x="1.5" y="2.5" width="3.4" height="9" rx="1" fill="none" stroke="currentColor" stroke-width="1.3"/><rect x="5.8" y="2.5" width="3.4" height="6.5" rx="1" fill="none" stroke="currentColor" stroke-width="1.3"/><rect x="10.1" y="2.5" width="3.4" height="4.5" rx="1" fill="none" stroke="currentColor" stroke-width="1.3"/></g>
<g id="ic-eye-off"><path d="M1.6 7 C3.2 4.3 5 3.1 7 3.1 C9 3.1 10.8 4.3 12.4 7 C10.8 9.7 9 10.9 7 10.9 C5 10.9 3.2 9.7 1.6 7 Z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><circle cx="7" cy="7" r="1.9" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M2.7 11.3 L11.3 2.7" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></g>
</defs>
</svg>{{end}}

{{define "state-icon"}}<svg class="st-icon" width="14" height="14" style="color:var(--st-{{.}})"><use href="#st-{{.}}"/></svg>{{end}}

{{define "priority-icon"}}{{if eq . "urgent"}}<svg class="pri-icon" width="14" height="14"><use href="#pri-urgent"/></svg>{{else if ne . "none"}}<svg class="pri-icon" width="14" height="14" style="color:var(--text-3)"><use href="#pri-{{.}}"/></svg>{{end}}{{end}}

{{define "avatar"}}{{if .Initials}}<span class="avatar {{.Class}}">{{.Initials}}</span>{{end}}{{end}}
