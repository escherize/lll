# TASK-171: Fly configuration. One published port — the board on 8100, which
# also serves the API under /api/ (LLL-371) — and one volume, because the
# machine filesystem is ephemeral and pb/pb_data is the backlog.
#
# app = the Fly app name; set it once with `fly apps create <name>` and keep
# this file's `app =` in agreement (or delete the line and pass --app).

app = "escherize-lll"
primary_region = "ord"

[build]

[env]
  LLL_BIND = "0.0.0.0"
  LLL_TEAM = "ENG"

[http_service]
  internal_port = 8100
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

# LLL-371: the API had its own service here, published as :8091 over a
# dedicated IPv4 (~$2/mo, because Fly's shared IPv4 carries only the 80/443
# http_service). It is gone. The board serves /api/ and /_/ under its own 443
# origin by proxying the PocketBase it runs in-process, so one address is both
# the board and the API and there is no port for anyone to guess or configure.
#
# A client whose url still carries :8091 fixes it by dropping the port. The
# non-JSON-404 hint in pb/client.lis still names :8091 deliberately - that is
# advice about OLDER servers, which have not taken this move.

[mounts]
  source = "lll_data"
  destination = "/data/pb_data"
